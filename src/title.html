<script>
(function(){
'use strict';
var root=document.documentElement,title=document.getElementById('title');
function fit(){var cs=getComputedStyle(document.body),pl=parseFloat(cs.paddingLeft)||0,pr=parseFloat(cs.paddingRight)||0,pt=parseFloat(cs.paddingTop)||0,pb=parseFloat(cs.paddingBottom)||0,aw=Math.max(120,innerWidth-pl-pr),ah=Math.max(120,innerHeight-pt-pb),u=Math.min(aw/360,ah/640),st=document.getElementById('stage');st.style.width=Math.floor(360*u)+'px';st.style.height=Math.floor(640*u)+'px';root.style.fontSize=(16*u).toFixed(2)+'px';root.style.setProperty('--u',u.toFixed(4)+'px')}
fit();addEventListener('resize',fit);addEventListener('orientationchange',fit);
function $(i){return document.getElementById(i)}

  if(save){try{localStorage.setItem('pd-calm',v?'1':'0')}catch(e){}}}

function look(c,x,y){var r=c.el.getBoundingClientRect(),dx=x-(r.left+r.width/2),dy=y-(r.top+r.height*.52),d=Math.sqrt(dx*dx+dy*dy)||1,k=Math.min(1,d/140);
  c.pupils.style.transform='translate('+(dx/d*4.6*k).toFixed(2)+'px,'+(dy/d*4.6*k).toFixed(2)+'px)'}

var px=0,py=0,pend=false,idleT=0;
document.addEventListener('pointermove',function(e){if(!cw.hidden)return;px=e.clientX;py=e.clientY;if(!pend){pend=true;requestAnimationFrame(function(){pend=false;chars.forEach(function(c){look(c,px,py)})})}
  clearTimeout(idleT);idleT=setTimeout(function(){chars.forEach(lookIdle)},2500)},{passive:true});

var POP={pa:['wheee!','hehe!','yay!'],pg:['no thanks!','brrr!','hee hee!']};
var COL={pa:{c:'#b86e00',bits:['#f8bd1c','#ffe58a','#7fd68f']},pg:{c:'#3b3a78',bits:['#ffffff','#cfe9f5','#8fc6e4']}};
function press(c,e){
  var o=chars[1-chars.indexOf(c)];
  setMood(c,'glad',650);setMood(o,'wow',700);
  if(calm)return;
  var tr=title.getBoundingClientRect(),r=c.el.getBoundingClientRect();
  var cx=(e&&e.clientX!=null)?e.clientX:r.left+r.width/2,cy=(e&&e.clientY!=null)?e.clientY:r.top+r.height*.4;

  c.art.animate([{transform:'rotate(0deg) scale(1,1)'},{transform:'rotate('+tilt.toFixed(1)+'deg) scale(1.09,0.88)',offset:.28},{transform:'rotate('+(-tilt*.35).toFixed(1)+'deg) scale(0.96,1.07)',offset:.62},{transform:'rotate(0deg) scale(1,1)'}],{duration:300,easing:'ease-out'});
  var words=POP[c.id],p=mk('pop');p.textContent=words[Math.floor(Math.random()*words.length)];
  p.style.cssText='left:'+(x+Math.random()*28-14)+'px;top:'+y+'px;--c:'+COL[c.id].c+';--glow:'+(c.id==='pa'?'#ffd24a':'#9a98ff');title.appendChild(p);
  var rot=Math.random()*24-12;
  p.animate([{transform:'translate(-50%,-50%) scale(.3) rotate('+rot+'deg)',opacity:0},{transform:'translate(-50%,-75%) scale(1.5) rotate('+rot+'deg)',opacity:1,offset:.18},{transform:'translate(-50%,-105%) scale(1) rotate('+rot*.4+'deg)',opacity:1,offset:.42},{transform:'translate(-50%,-300%) scale(.85)',opacity:0}],{duration:950,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish=function(){p.remove()};
  var cols=COL[c.id].bits;
  for(var i=0;i<10;i++){var k=i%3,s=4+Math.random()*6,b=mk('bit'),w=s,h=s,rad='50%',bg=cols[Math.floor(i/3)%3];
    if(k===0){w=s*.75;h=s*1.25;rad='50% 50% 50% 50% / 62% 62% 38% 38%'}else if(k===1){w=s*1.2;h=s*.75;rad='2px';bg='#fff3cf'}else{w=3.2;h=5.6;bg='#4a2c18'}
    b.style.cssText='left:'+x+'px;top:'+y+'px;width:'+w+'px;height:'+h+'px;border-radius:'+rad+';background:'+bg;title.appendChild(b);
    var a=Math.random()*Math.PI*2,dx=Math.cos(a)*74*(.45+Math.random()*.8),up=-(26+Math.random()*74*.85),dn=30+Math.random()*56,ro=Math.random()*540-270;
    b.animate([{transform:'translate(-50%,-50%) rotate(0) scale(1)',opacity:1,easing:'cubic-bezier(.2,.7,.4,1)'},{transform:'translate(calc(-50% + '+dx*.6+'px),calc(-50% + '+up+'px)) rotate('+ro/2+'deg)',opacity:1,offset:.4,easing:'ease-in'},{transform:'translate(calc(-50% + '+dx*1.3+'px),calc(-50% + '+dn+'px)) rotate('+ro+'deg) scale(.5)',opacity:0}],{duration:650+Math.random()*450}).onfinish=(function(b){return function(){b.remove()}})(b)}
  var rg=mk('ring');c.el.appendChild(rg);rg.animate([{transform:'scale(.75)',opacity:.85},{transform:'scale(1.7)',opacity:0}],{duration:520,easing:'ease-out'}).onfinish=function(){rg.remove()};

  c.el.addEventListener('click',function(e){press(c,e)});
  c.el.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();press(c,null)}});
});

var cw=$('cw'),opener=null;
function openCard(tid,t,from){$('cardBody').replaceChildren($(tid).content.cloneNode(true));$('cardTitle').textContent=t;cw.hidden=false;root.setAttribute('data-dlg','1');opener=from;$('cardOk').focus()}
function closeCard(){cw.hidden=true;root.removeAttribute('data-dlg');if(opener)opener.focus()}
$('bHow').addEventListener('click',function(){openCard('t-how','How to play',this)});
$('bSet').addEventListener('click',function(){openCard('t-set','Settings',this)});
$('bTro').addEventListener('click',function(){openCard('t-ach','Trophies',this)});
$('bShop').addEventListener('click',function(){openCard('t-shop','Shop',this)});
$('bRep').addEventListener('click',function(){openCard('t-rep','Replay a stage',this)});
var bb=$('bb'),SL=['BRRR IS BEST!','SNOW DAYS ROCK!','FROSTY FEET!','NO SPIKY FRUIT!','FISH SNACKS!','TOO TOASTY!'],si=0;
function setBB(t){bb.textContent=t;bb.style.fontSize='9.6px';var L=bb.getComputedTextLength?bb.getComputedTextLength():0;if(L>62)bb.style.fontSize=(9.6*62/L).toFixed(2)+'px'}
setInterval(function(){if(title.hidden||!cw.hidden||document.hidden||root.getAttribute('data-calm')==='1')return;si=(si+1)%SL.length;bb.classList.add('flip');setTimeout(function(){setBB(SL[si])},230);setTimeout(function(){bb.classList.remove('flip')},470)},4200);
$('cardOk').addEventListener('click',closeCard);
cw.addEventListener('click',function(e){if(e.target===cw)closeCard()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!cw.hidden)closeCard()});
})();
