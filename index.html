/* sticker-text.css: companion to sticker-text.js. MIT, Copyright (c) 2026 JNFoo (see LICENSE). */
.sticker-text {
  --st-fill: linear-gradient(180deg, #ff9a7c 0%, #e8392d 45%, #a3150f 100%);   /* the letter fill */
  --st-edge: #7a120d;                                                           /* hard lower edge */
  position: relative; display: inline-block;
  font-weight: 800; line-height: .92; letter-spacing: -.02em; white-space: nowrap;
  padding-inline: .06em .1em;                         /* room for the outline */
  color: transparent;                                 /* the real text only holds the layout */
  transform: rotate(-2deg); transform-origin: 0 100%; /* a slight tilt reads as hand-placed */
  filter: drop-shadow(0 .05em 0 var(--st-edge)) drop-shadow(0 .1em .07em rgba(0, 0, 0, .28));
}
.sticker-text::before, .sticker-text::after {
  content: attr(data-t); position: absolute; left: 0; top: 0; padding-inline: inherit; white-space: nowrap;
}
.sticker-text::before { color: var(--st-outline, #fff7e3); text-shadow: var(--st-ring); }   /* the outline layer */
.sticker-text::after {
  background: var(--st-fill); -webkit-background-clip: text; background-clip: text;
  color: transparent; -webkit-text-fill-color: transparent;                                /* the gradient layer */
}
/* Chunky "thick plastic" pill for the subtitle: gradient + hard lip + soft shadow + inner top highlight. */
.sticker-pill {
  display: inline-block; padding: .1em .7em .16em; border-radius: .35em;
  font-weight: 800; letter-spacing: .2em; text-transform: uppercase; color: #fff;
  background: linear-gradient(180deg, #62c981, #2c8a49);
  box-shadow: 0 .12em 0 #1b5c32, 0 .3em .5em rgba(0, 0, 0, .22), inset 0 .08em 0 rgba(255, 255, 255, .35);
  text-shadow: 0 .06em 0 rgba(0, 0, 0, .28); transform: rotate(-2deg);
}

:root{
  --ink:#2a120d;--cream:#fff7e3;--panel:#fbfcfc;--fg:#162226;--muted:#55656b;--line:#d0dadd;
  --sky-top:#b5d6e8;--sky-bot:#eef5f1;
  --pa-hi:#ffeaa0;--pa-mid:#f8bd1c;--pa-lo:#a85a07;--pa-glow:#ffd24a;
  --pg-hi:#6b6aab;--pg-mid:#383767;--pg-lo:#171538;--pg-glow:#9a98ff;
  --display:'Bricolage Grotesque',system-ui,sans-serif;--body:'Figtree',system-ui,sans-serif;
  --menu-h:176px;--floor-h:calc(var(--menu-h) + 8vh);
  color-scheme:only light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky-top);font-family:var(--body);color:var(--fg);touch-action:manipulation;-webkit-user-select:none;user-select:none}
.title{position:fixed;inset:0;overflow:hidden;background:linear-gradient(180deg,var(--sky-top) 0%,#cfe6ec 50%,var(--sky-bot) 80%)}
.title::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:6;background:radial-gradient(ellipse at 50% 55%,transparent 62%,rgba(42,18,13,.2) 100%)}
.sun{position:absolute;right:7vw;top:7vh;width:clamp(70px,15vmin,160px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fff3c4 0 36%,#ffe08a 37% 60%,rgba(255,217,138,.32) 61% 100%);animation:breathe 5.2s ease-in-out infinite}
.cloud{position:absolute;left:-30vw;width:clamp(110px,24vmin,260px);opacity:.85;animation:drift 110s linear infinite}
.c1{top:22vh;animation-delay:-20s}.c2{top:36vh;width:clamp(80px,17vmin,190px);opacity:.7;animation-duration:150s;animation-delay:-90s}.c3{top:12vh;width:clamp(90px,20vmin,220px);opacity:.8;animation-duration:130s;animation-delay:-55s}
.floor{position:absolute;left:0;right:0;bottom:0;height:var(--floor-h);background:linear-gradient(90deg,#e2cb8f 0%,#ecdfb4 42%,#eef4f6 58%,#f9fcfd 100%)}
.floor::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(90,60,20,0),rgba(90,60,20,.12))}
.land{position:absolute;left:0;bottom:calc(var(--floor-h) - 2px);width:100%;height:auto;display:block}
.poster{transform-box:fill-box;transform-origin:50% 0;animation:flap 4.2s ease-in-out infinite alternate}
.poster:nth-of-type(2){animation-duration:3.6s}.poster:nth-of-type(3){animation-duration:4.9s}

.logo{position:absolute;top:clamp(8px,2.6vh,30px);left:50%;transform:translateX(-50%);margin:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:clamp(2.1rem,min(12.5vw,10.5vh),5.8rem);line-height:1;letter-spacing:-.02em;white-space:nowrap;z-index:3}
.logo .mini{width:1.45em;height:1.45em;flex:none;position:relative;z-index:2;overflow:visible;filter:drop-shadow(0 .05em 0 rgba(0,0,0,.16))}
.mini-l{margin-inline:-.1em -.5em}.mini-r{margin-inline:-.4em -.1em;transform:rotate(4deg)}
.words{display:flex;flex-direction:column;align-items:flex-start;position:relative;z-index:1}
.logo-1{font-weight:800;font-size:1em;--st-fill:linear-gradient(180deg,#fff2a8 0%,#f8bd1c 46%,#b3600a 100%);--st-edge:#7a3a05;--st-outline:#fff7e3}
.logo-2{font-size:.4em;margin:.4em 0 0 .7em;background:linear-gradient(180deg,#7fd9f5,#2a8fc4);box-shadow:0 .12em 0 #17608a,0 .3em .5em rgba(0,0,0,.22),inset 0 .08em 0 rgba(255,255,255,.4)}
.spark{position:absolute;width:.34em;height:.34em;background:#ffd23f;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:twinkle 2.8s ease-in-out infinite;z-index:3}
.s1{left:3%;top:-6%}.s2{right:2%;top:2%;animation-delay:-.9s;width:.26em;height:.26em}.s3{left:46%;top:-14%;animation-delay:-1.7s;width:.22em;height:.22em}

.duo{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--menu-h) + 2vh);display:flex;align-items:flex-end;justify-content:center;z-index:2}
.char{position:relative;width:clamp(120px,min(38vw,43vh),400px);aspect-ratio:1;cursor:pointer;outline:none;--bob:3.4s;--blink:4.6s}
.char+.char{margin-left:0;--bob:3.8s;--blink:5.1s}
.char:focus-visible{outline:3px solid #1f6feb;outline-offset:2px;border-radius:12px}
.brow{display:none}
.char[data-mood="happy"] .brow{display:block}
.char{transform-origin:50% 90%}
.pa{rotate:5deg;animation:leanL 7s ease-in-out infinite}
.pg{rotate:-5deg;animation:leanR 7s ease-in-out 0s infinite}
.pa .face{transform:translateX(8px)}.pg .face{transform:translateX(-8px)}
.fo{position:absolute;font-size:clamp(1.5rem,5.5vmin,2.8rem);z-index:4;pointer-events:none}
.fo1{left:calc(50% - .17em);top:14%}.fo2{left:calc(50% + .6em);top:26%;animation-delay:-1.1s;font-size:.7em}.fo3{left:calc(50% - 1em);top:30%;animation-delay:-2s;font-size:.6em}
@keyframes leanL{0%,78%,100%{transform:translateX(0)}88%{transform:translateX(2.4vw)}}
@keyframes leanR{0%,78%,100%{transform:translateX(0)}88%{transform:translateX(-2.4vw)}}
.ground{position:absolute;left:18%;right:18%;bottom:3%;height:6%;border-radius:50%;background:rgba(42,18,13,.26);filter:blur(3px)}
.aura{position:absolute;inset:-4%;border-radius:50%;background:radial-gradient(circle,var(--glow) 0,transparent 66%);opacity:.26;animation:aura 3.2s ease-in-out infinite}
.bob{position:absolute;inset:0;animation:bob var(--bob) ease-in-out infinite}
.wig{position:absolute;inset:0;transform-origin:50% 90%;animation:wiggle 9s ease-in-out 3s infinite}
.pg .wig{animation-delay:6s}
.art{position:absolute;inset:0;transform-origin:50% 90%}
.art-svg{width:100%;height:100%;display:block;overflow:visible}
.eyes{transform-box:fill-box;transform-origin:50% 50%;animation:blink var(--blink) infinite}
.pupils{transition:transform 90ms ease-out}
.flip-up{transform-box:fill-box;transform-origin:90% 90%;animation:wave 2.6s ease-in-out infinite alternate}
.crest-r{transform-origin:132px 70px}
.face .m-o,.face .m-grin,.face .m-pout{display:none}
.char[data-mood="wow"] .m-smile,.char[data-mood="giggle"] .m-smile{display:none}
.char[data-mood="wow"] .m-o{display:block}
.char[data-mood="giggle"] .m-grin{display:block}
.char[data-mood="giggle"] .cheek,.char[data-mood="wow"] .cheek{opacity:.75}
.ring{position:absolute;inset:6%;border:4px solid var(--glow);border-radius:50%;pointer-events:none}
.pop{position:absolute;pointer-events:none;z-index:5;white-space:nowrap;font:800 clamp(1.3rem,4vmin,2.3rem)/1 var(--display);color:var(--c);text-shadow:-2px 0 var(--cream),2px 0 var(--cream),0 -2px var(--cream),0 2px var(--cream),-2px -2px var(--cream),2px 2px var(--cream),-2px 2px var(--cream),2px -2px var(--cream),0 0 16px var(--glow)}

/* ---------- input ---------- */
var drag = null;
function rel(e) { var r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top, t: e.timeStamp }; }
cv.addEventListener('pointerdown', function (e) {
  if (S.paused || S.over || drag) return;
  try { cv.setPointerCapture(e.pointerId); } catch (x) {}
  var p = rel(e); drag = { id: e.pointerId, sx: p.x, sy: p.y, t0: p.t, pts: [p] };
  e.preventDefault();
});
cv.addEventListener('pointermove', function (e) {
  if (!drag || e.pointerId !== drag.id) return;
  drag.pts.push(rel(e)); if (drag.pts.length > 10) drag.pts.shift();
});
cv.addEventListener('pointercancel', function () { drag = null; });
cv.addEventListener('pointerup', function (e) {
  if (!drag || e.pointerId !== drag.id) return;
  var d = drag; drag = null;
  var end = rel(e), vx = end.x - d.sx, vy = end.y - d.sy, len = Math.hypot(vx, vy), m = Math.min(W, H);
  var oy = H * 0.93, ox;
  if (len < TAP_MIN * m) return;   // flick only: a plain tap does nothing
  if (vy > -FLICK_MIN * H) return;
  var old = d.pts[0], i;
  for (i = d.pts.length - 1; i >= 0; i--) { if (end.t - d.pts[i].t >= 60) { old = d.pts[i]; break; } }
  var dx = end.x - old.x, dy = end.y - old.y;
  if (dy > -2) { dx = vx; dy = vy; old = { t: d.t0 }; }
  var dur = Math.max(30, end.t - old.t), spd = Math.hypot(dx, dy) / dur * 1000 / H;
  ox = W / 2 + (d.sx - W / 2) * 0.55;
  throwAt(ox, oy, dx, dy, spd, null);
});
cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });

/* ---------- cards, pause, screens ---------- */
var gcw = $('gcw');
function showCard(title, body, btn1, fn1, noTitleBtn) {
  $('gTitle').textContent = title; $('gBody').textContent = body;
  var b1 = $('gBtn1'); b1.textContent = btn1; b1.onclick = function () { hideCard(); fn1(); };
  $('gBtn2').onclick = function () { hideCard(); toTitle(); };
  gcw.hidden = false; b1.focus();
}
function hideCard() { gcw.hidden = true; }
function startAgain() { startStage(); run(); }
function pause() {
  if (S.paused || S.over || !running) return;
  S.paused = true; halt();
  showCard('Paused', 'Take your time.', 'Resume', resume);
  $('gBtn2').textContent = 'Back to title';
}
function resume() { S.paused = false; run(); }
$('bPause').addEventListener('click', pause);
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && gameEl.hidden === false && !S.paused) pause(); });
document.addEventListener('visibilitychange', function () { if (document.hidden && gameEl.hidden === false) pause(); });
function toTitle() { updateContinue(); halt(); S.paused = false; gameEl.hidden = true; titleEl.hidden = false; $('bPlay').focus(); }
$('gBtn2').textContent = 'Title';
window.addEventListener('resize', function () { if (gameEl.hidden === false) { resize(); if (!running) { draw(); } } });

function start() {
  titleEl.hidden = true; gameEl.hidden = false;
  loadAssets().then(function () { resize(); startStage(); run(); });
}
$('bPlay').addEventListener('click', start);
btnCont.addEventListener('click', function () { if (!btnCont.disabled) continueGame(); });

/* ---------- save code and file (Settings card) ---------- */
function wireSettings() {
  var body = $('cardBody'), $b = function (id) { return body.querySelector('#' + id); };
  if (!$b('svShow')) return;
  var msg = $b('svMsg'), codeBox = $b('svCode'), copyBtn = $b('svCopy'), paste = $b('svPaste'), pick = $b('svPick');
  function say(t) { msg.textContent = t; }
  function cur() { return JSON.parse(JSON.stringify(sv)); }
  $b('svShow').addEventListener('click', function () {
    kit.exportCode(cur()).then(function (c) { codeBox.value = c; codeBox.hidden = false; copyBtn.hidden = false; codeBox.focus(); codeBox.select(); say('Here is your save code.'); });
  });
  copyBtn.addEventListener('click', function () {
    codeBox.select();
    var done = function () { say('Copied!'); };
    var fallback = function () { try { document.execCommand('copy'); done(); } catch (e) { say('Select the code and copy it.'); } };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(codeBox.value).then(done, fallback); else fallback();
  });
  $b('svFile').addEventListener('click', function () {
    kit.exportCode(cur()).then(function (c) {
      var a = document.createElement('a'), url = URL.createObjectURL(new Blob([c + '\n'], { type: 'text/plain' }));
      a.href = url; a.download = 'pineapple-defense-save.txt'; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 3000); say('Save file made.');
    });
  });
  function load(text) {
    kit.importCode(text).then(function (clean) {
      if (!kit.stageImport(clean, cur())) { say('This browser would not let me save that.'); return; }
      say('Loaded! Reloading...'); setTimeout(function () { location.reload(); }, 500);
    }, function (m) { say(String(m)); });
  }
  var loadBtn = $b('svLoad');
  loadBtn.addEventListener('click', SaveKit.twoTap(function () { load(paste.value); }, 3000,
    function () { loadBtn.textContent = 'Tap again to replace your game'; say('This replaces the game on this device.'); },
    function () { loadBtn.textContent = 'Load code'; }));
  $b('svFileLoad').addEventListener('click', function () { pick.click(); });
  pick.addEventListener('change', function () {
    var f = pick.files && pick.files[0]; if (!f) return;
    f.text().then(load, function () { say('I could not read that file.'); });
  });
}
$('bSet').addEventListener('click', wireSettings);

/* test hook, only with #qa in the address */
var qa = null;
if (location.hash === '#qa') {
  qa = window.__pd = { bot: false, sv: function () { return sv; }, scale: function (v) { timeScale = v; }, get S() { return S; }, get penguins() { return penguins; },
    tap: function (x, y) { throwAt(W / 2, H * 0.93, x - W / 2, y - H * 0.93, 1.5, { x: x, y: y }); } };
}
}());
