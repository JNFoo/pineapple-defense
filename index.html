/* sticker-text.css: companion to sticker-text.js. MIT, Copyright (c) 2026 JNFoo (see LICENSE). */
.sticker-text {
  --st-fill: linear-gradient(180deg, #ff9a7c 0%, #e8392d 45%, #a3150f 100%);   /* the letter fill */
  --st-edge: #7a120d;                                                           /* hard lower edge */
  position: relative; display: inline-block;
  font-weight: 800; line-height: .92; letter-spacing: -.02em; white-space: nowrap;
  padding-inline: .06em .1em;                         /* room for the outline */
  color: transparent;                                 /* the real text only holds the layout */
  transform: rotate(-2deg); transform-origin: 0 100%; /* a slight tilt reads as hand-placed */
  filter: drop-shadow(0 .05em 0 var(--st-edge)) drop-shadow(0 .1em .07em rgba(0, 0, 0, .28));
}
.sticker-text::before, .sticker-text::after {
  content: attr(data-t); position: absolute; left: 0; top: 0; padding-inline: inherit; white-space: nowrap;
}
.sticker-text::before { color: var(--st-outline, #fff7e3); text-shadow: var(--st-ring); }   /* the outline layer */
.sticker-text::after {
  background: var(--st-fill); -webkit-background-clip: text; background-clip: text;
  color: transparent; -webkit-text-fill-color: transparent;                                /* the gradient layer */
}
/* Chunky "thick plastic" pill for the subtitle: gradient + hard lip + soft shadow + inner top highlight. */
.sticker-pill {
  display: inline-block; padding: .1em .7em .16em; border-radius: .35em;
  font-weight: 800; letter-spacing: .2em; text-transform: uppercase; color: #fff;
  background: linear-gradient(180deg, #62c981, #2c8a49);
  box-shadow: 0 .12em 0 #1b5c32, 0 .3em .5em rgba(0, 0, 0, .22), inset 0 .08em 0 rgba(255, 255, 255, .35);
  text-shadow: 0 .06em 0 rgba(0, 0, 0, .28); transform: rotate(-2deg);
}

:root{
  --ink:#2a120d;--cream:#fff7e3;--panel:#fbfcfc;--fg:#162226;--muted:#55656b;--line:#d0dadd;
  --sky-top:#b5d6e8;--sky-bot:#eef5f1;
  --pa-hi:#ffeaa0;--pa-mid:#f8bd1c;--pa-lo:#a85a07;--pa-glow:#ffd24a;
  --pg-hi:#6b6aab;--pg-mid:#383767;--pg-lo:#171538;--pg-glow:#9a98ff;
  --display:'Bricolage Grotesque',system-ui,sans-serif;--body:'Figtree',system-ui,sans-serif;
  --floor-h:30cqh;
  color-scheme:only light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:#23203f;overscroll-behavior:none;font-family:var(--body);color:var(--fg);touch-action:manipulation;-webkit-user-select:none;user-select:none}
body{height:100dvh;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);display:flex;align-items:center;justify-content:center}
#stage{position:relative;flex:none;width:360px;height:640px;container-type:size;overflow:hidden;border-radius:14px;background:#cfe6ec;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 12px 60px rgba(0,0,0,.5)}
.title{position:absolute;inset:0;overflow:hidden;background:linear-gradient(180deg,var(--sky-top) 0%,#cfe6ec 50%,var(--sky-bot) 80%)}
.title::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:6;background:radial-gradient(ellipse at 50% 55%,transparent 62%,rgba(42,18,13,.2) 100%)}
.sun{position:absolute;right:7cqw;top:7cqh;width:clamp(70px,15cqmin,160px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fff3c4 0 36%,#ffe08a 37% 60%,rgba(255,217,138,.32) 61% 100%);animation:breathe 5.2s ease-in-out infinite}
.cloud{position:absolute;left:-30cqw;width:clamp(110px,24cqmin,260px);opacity:.85;animation:drift 110s linear infinite}
.c1{top:22cqh;animation-delay:-20s}.c2{top:36cqh;width:clamp(80px,17cqmin,190px);opacity:.7;animation-duration:150s;animation-delay:-90s}.c3{top:12cqh;width:clamp(90px,20cqmin,220px);opacity:.8;animation-duration:130s;animation-delay:-55s}
.floor{position:absolute;left:0;right:0;bottom:0;height:var(--floor-h);background:linear-gradient(90deg,#e2cb8f 0%,#ecdfb4 42%,#eef4f6 58%,#f9fcfd 100%)}
.floor::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(90,60,20,0),rgba(90,60,20,.12))}
.land{position:absolute;left:0;bottom:calc(var(--floor-h) - 2px);width:100%;height:auto;display:block}
.poster{transform-box:fill-box;transform-origin:50% 0;animation:flap 4.2s ease-in-out infinite alternate}
.poster:nth-of-type(2){animation-duration:3.6s}.poster:nth-of-type(3){animation-duration:4.9s}

.logo{position:absolute;top:clamp(8px,2.6cqh,30px);left:50%;transform:translateX(-50%);margin:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:clamp(2.1rem,min(12.5cqw,10.5cqh),5.8rem);line-height:1;letter-spacing:-.02em;white-space:nowrap;z-index:3}
.logo .mini{width:1.45em;height:1.45em;flex:none;position:relative;z-index:2;overflow:visible;filter:drop-shadow(0 .05em 0 rgba(0,0,0,.16))}
.mini-l{margin-inline:-.1em -.5em}.mini-r{margin-inline:-.4em -.1em;transform:rotate(4deg)}
.words{display:flex;flex-direction:column;align-items:flex-start;position:relative;z-index:1}
.logo-1{display:inline-flex;align-items:baseline;transform:rotate(-2deg);transform-origin:0 100%;font-weight:800;font-size:1em;--st-fill:linear-gradient(180deg,#fff2a8 0%,#f8bd1c 46%,#b3600a 100%);--st-edge:#7a3a05;--st-outline:#fff7e3}
.logo-2{position:relative;align-self:stretch;margin:.22em -.15em 0 -.15em;font-size:.6em;transform:rotate(-1.4deg);display:flex;align-items:center;justify-content:center;height:2.05em;filter:drop-shadow(0 .16em .22em rgba(0,0,0,.3))}
.logo-2 .plate,.logo-2 .scuff{position:absolute;left:-.04em;top:-.06em;width:calc(100% + .08em);height:calc(100% + .14em);overflow:visible}.logo-2 .scuff{pointer-events:none;z-index:2}
.logo-2 .lt{position:relative;z-index:1;font:800 1em/1 var(--display);letter-spacing:.2em;padding-left:.2em;color:#fffdf3;-webkit-text-stroke:.16em #0b3350;paint-order:stroke fill;text-shadow:0 .09em 0 #0b3350,0 .2em .25em rgba(0,0,0,.25)}
.logo-1 .lw{transform:none;--st-fill:linear-gradient(180deg,#fff2a8 0%,#f8bd1c 46%,#b3600a 100%);--st-edge:#7a3a05;--st-outline:#fff7e3}.lpa{width:.95em;height:.95em;flex:none;overflow:visible;margin:0 -.24em 0 -.2em;filter:drop-shadow(0 .05em 0 #7a3a05) drop-shadow(0 .1em .07em rgba(0,0,0,.28));position:relative;z-index:1}
.spark{position:absolute;width:.34em;height:.34em;background:#ffd23f;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:twinkle 2.8s ease-in-out infinite;z-index:3}
.s1{left:3%;top:-6%}.s2{right:2%;top:2%;animation-delay:-.9s;width:.26em;height:.26em}.s3{left:46%;top:-14%;animation-delay:-1.7s;width:.22em;height:.22em}

.duo{position:absolute;left:50%;transform:translateX(-50%);bottom:-3cqh;width:max-content;display:flex;align-items:flex-end;justify-content:center;z-index:2}
.char{position:relative;width:clamp(120px,min(38cqw,43cqh),400px);aspect-ratio:1;flex:none;cursor:pointer;outline:none;--bob:3.4s;--blink:4.6s}
.char+.char{margin-left:0;--bob:3.8s;--blink:5.1s}
.char:focus-visible{outline:3px solid #1f6feb;outline-offset:2px;border-radius:12px}
.brow{display:none}
.char[data-mood="happy"] .brow{display:block}
.char{transform-origin:50% 90%}
.pa{rotate:8deg;animation:leanL 7s ease-in-out infinite}
.pg{rotate:-8deg;animation:leanR 7s ease-in-out 0s infinite}
.pa .face{transform:translateX(14px)}.pg .face{transform:translateX(-14px)}
.fo{position:absolute;font-size:clamp(1.5rem,5.5cqmin,2.8rem);z-index:4;pointer-events:none}
.fo1{left:calc(50% - .17em);top:30%}.fo2{left:calc(50% + .6em);top:42%;animation-delay:-1.1s;font-size:.7em}.fo3{left:calc(50% - 1em);top:24%;animation-delay:-2s;font-size:.6em}
@keyframes leanL{0%,78%,100%{transform:translateX(0)}88%{transform:translateX(2.4cqw)}}
@keyframes leanR{0%,78%,100%{transform:translateX(0)}88%{transform:translateX(-2.4cqw)}}
.ground{position:absolute;left:18%;right:18%;bottom:3%;height:6%;border-radius:50%;background:rgba(42,18,13,.26);filter:blur(3px)}

<script>/* even-dt: smooths the uneven frame gaps a browser reports by snapping them to the screen's learned refresh period. MIT License, Copyright (c) 2026 JNFoo. https://github.com/JNFoo/JS-modules */
'use strict';

/**
 * EvenDt
 *
 * Browsers report frame gaps (the time between two requestAnimationFrame
 * callbacks) that wobble by a millisecond or two even when every frame is
 * presented on time. A game that moves by that raw gap shows the wobble as a
 * faint shiver in scrolling scenery. EvenDt:
 *
 *   1. learns the screen's real period (the MEDIAN of the recent gaps),
 *   2. snaps each gap to the nearest whole multiple of that period when it is
 *      close enough (within `tolerance` of the period), and
 *   3. pays the left-over difference back slowly (`payback` per frame) so the
 *      game clock never drifts away from real time.
 *
 * Gaps that are not close to a whole multiple (real stalls) pass through
 * untouched, and the owed drift is dropped at that point.
 *
 * Usage:
 *   var even = new EvenDt();
 *   function frame(now) {
 *     var dtMs = even.next(now - last); last = now;
 *     step(dtMs / 1000);
 *   }
 *
 * Every option is optional; the defaults are the values from the game this was
 * extracted from.
 */

  function pick(v, d) { return v === undefined || v === null ? d : v; }

  /**
   * @param {object} [opts]
   * @param {number} [opts.minGap=2]       Gaps at or below this (ms) are ignored (returned as is, not learned from).
   * @param {number} [opts.maxGap=60]      Gaps at or above this (ms) are ignored: tab switches, long stalls.
   * @param {number} [opts.window=40]      How many recent gaps the median is taken over.
   * @param {number} [opts.warmup=12]      Gaps needed before any snapping starts (raw gaps are returned until then).
   * @param {number} [opts.refreshEvery=8] The median is recomputed every this many accepted gaps.
   * @param {number} [opts.maxMultiple=3]  Largest whole multiple of the period that may be snapped to (2 = a dropped frame).
   * @param {number} [opts.tolerance=0.3]  A gap snaps only if it is within this fraction of the period from a multiple.
   * @param {number} [opts.payback=0.04]   Fraction of the owed drift paid back per frame (0 = never, 1 = at once).

'use strict';

 * QualityGovernor

 * levels-1 (lightest):
 *

 *     since the last change. The average is then reset so the next step has to
 *     be earned again from scratch.
 *   - STEP UP (level - 1) when the smoothed gap has been "fast" for a total of
 *     `fastMs` of real time in a row AND at least `upDelay` ms have passed
 *     since the last change.
 *
 * Stepping down is quick and stepping up is slow on purpose (hysteresis), so
 * the level does not flap between two settings at a borderline frame rate.
 * What a level MEANS is entirely up to the caller (fewer particles, lower
 * canvas resolution, ...): do it in `onChange`.
 *
 * KNOWN LIMITATION: "slow" and "fast" are measured against a 60 Hz screen
 * (16.7 ms) by default. A clean 30 Hz screen (33.3 ms gaps) therefore looks
 * slow and will be stepped all the way down even though it is running fine.
 * If you know the expected period, pass `expectedPeriod` (for example the
 * period learned by EvenDt) and the thresholds scale with it. The governor
 * cannot tell "this screen is 30 Hz" from "this machine is struggling at
 * 30 fps" by itself.
 *
 * Usage:
 *   var gov = new QualityGovernor({
 *     levels: 5,
 *     onChange(level) { applyQuality(level); }
 *   });
 *   function frame(now) { gov.frame(now - last, now); last = now; }

  // The original game's thresholds were 22 ms (slow) and 18.5 ms (fast) around

  var BASE_PERIOD = 16.7;
  var SLOW_RATIO = 22 / BASE_PERIOD;
  var FAST_RATIO = 18.5 / BASE_PERIOD;

   * @param {number}   [opts.levels=5]           How many levels there are: 0 .. levels-1.

   * @param {number}   [opts.expectedPeriod=16.7] Normal frame gap (ms) of this screen. Sets the starting average and, unless overridden, the slow/fast thresholds.

    this.downDelay = pick(o.downDelay, 3000);
    this.fastMs = pick(o.fastMs, 10000);
